<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Tareas</title>
</head>
<body>
    <h1>Sistema de Registro de Tareas</h1>

    <main>
        <section id="formulario">
            <h2>Nueva Tarea</h2>

                <form action="formTarea">
                    <label for="Tarea">
                        Descripción:
                    </label>

                    <input
                    type="text"
                    id="Tarea"
                    placeholder="Ingrese una tarea"
                    required>

                    <button type="submit">
                        Registrar
                    </button>
                </form>
        </section>
        <section id="lista-tareas">
            <h2>Tareas registradas</h2>
            <ul>
                <li>Configurar repositorio Git</li>
                <li>Crear ramas de trabajo</li>
                <li>Integrar cambios en GitHub</li>
            </ul>
        </section>
    </main>
</body>
</html>
